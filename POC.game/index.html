<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Breaker</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { overflow: hidden; background: #000; cursor: crosshair; }
canvas { display: block; }
#hud { position: fixed; top: 12px; left: 16px; color: #aef; font: bold 18px monospace; text-shadow: 0 0 8px #4af; pointer-events: none; }
#hint { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); color: rgba(170,238,255,.5); font: 13px monospace; pointer-events: none; }
</style>
</head>
<body>
<div id="hud">SCORE <span id="score">0</span> &nbsp;&nbsp; LIVES <span id="lives">2</span></div>
<div id="hint">W/Up — thrust &nbsp;|&nbsp; S/Down — brake &nbsp;|&nbsp; A/Left D/Right — rotate &nbsp;|&nbsp; Space/Click — shoot</div>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
resize();
addEventListener('resize', resize);

// --- Input ---
const keys = {};
let shooting = false;
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') { shooting = true; e.preventDefault(); } });
addEventListener('keyup', e => { keys[e.code] = false; if (e.code === 'Space') shooting = false; });
addEventListener('mousedown', () => shooting = true);
addEventListener('mouseup', () => shooting = false);

// --- Game State ---
let score = 0;
let lives = 2;
let gameOver = false;
let invincible = 0;
let deadTimer = 0;
const bullets = [];
const rocks = [];
const particles = [];
const stars = [];
for (let i = 0; i < 200; i++) stars.push({ x: Math.random() * 4000 - 1000, y: Math.random() * 4000 - 1000, s: Math.random() * 1.5 + .3, b: Math.random() * .6 + .3 });

const ship = { x: 400, y: 300, angle: 0, vx: 0, vy: 0, alive: true };
let lastShot = 0;

// --- Rock / Planet spawning ---
function randRange(a, b) { return a + Math.random() * (b - a); }

function makeRock(x, y, size, vx, vy) {
  const verts = [];
  const n = 6 + Math.floor(Math.random() * 4);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = size * (0.7 + Math.random() * 0.5);
    verts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  let hue;
  if (size > 50) hue = randRange(80, 160);       // greenish planet
  else if (size > 25) hue = randRange(20, 50);   // orange rock
  else hue = randRange(200, 260);                // blue small rock
  return { x, y, size, vx: vx || randRange(-1, 1), vy: vy || randRange(-1, 1), rot: 0, rotSpd: randRange(-.02, .02), verts, hue, hp: Math.ceil(size / 10) };
}

function spawnInitialRocks() {
  for (let i = 0; i < 12; i++) {
    const sz = randRange(15, 90);
    rocks.push(makeRock(randRange(0, W), randRange(0, H), sz));
  }
}
spawnInitialRocks();

// --- Particles ---
function burst(x, y, count, color, spd) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const v = randRange(.5, spd || 4);
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1, decay: randRange(.015, .04), color });
  }
}

// --- Update ---
function update(dt) {
  if (gameOver) {
    if (keys['KeyR'] || shooting) restartGame();
    return;
  }

  if (!ship.alive) {
    deadTimer--;
    if (deadTimer <= 0 && lives > 0) respawnShip();
    // still update particles & rocks below
  } else {
    // Ship rotation
    const rotSpeed = 0.045;
    if (keys['KeyA'] || keys['ArrowLeft']) ship.angle -= rotSpeed;
    if (keys['KeyD'] || keys['ArrowRight']) ship.angle += rotSpeed;

    // Thrust & brake
    const thrust = 0.18, brake = 0.12, drag = 0.995, maxSpd = 7;
    if (keys['KeyW'] || keys['ArrowUp']) {
      ship.vx += Math.cos(ship.angle) * thrust;
      ship.vy += Math.sin(ship.angle) * thrust;
    }
    if (keys['KeyS'] || keys['ArrowDown']) {
      ship.vx -= Math.cos(ship.angle) * brake;
      ship.vy -= Math.sin(ship.angle) * brake;
    }
    ship.vx *= drag; ship.vy *= drag;
    const spd = Math.hypot(ship.vx, ship.vy);
    if (spd > maxSpd) { ship.vx = ship.vx / spd * maxSpd; ship.vy = ship.vy / spd * maxSpd; }
    ship.x += ship.vx; ship.y += ship.vy;
    ship.x = ((ship.x % W) + W) % W;
    ship.y = ((ship.y % H) + H) % H;

    // Invincibility countdown
    if (invincible > 0) invincible--;

    // Ship vs Rock collision
    if (invincible <= 0) {
      for (const r of rocks) {
        if (Math.hypot(ship.x - r.x, ship.y - r.y) < r.size * 0.7 + 10) {
          killShip(r);
          break;
        }
      }
    }
  }

  // Shooting
  const now = performance.now();
  if (shooting && now - lastShot > 120 && ship.alive) {
    lastShot = now;
    bullets.push({ x: ship.x + Math.cos(ship.angle) * 18, y: ship.y + Math.sin(ship.angle) * 18, vx: Math.cos(ship.angle) * 14 + ship.vx, vy: Math.sin(ship.angle) * 14 + ship.vy, life: 60 });
  }

  // Bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x < -50 || b.x > W + 50 || b.y < -50 || b.y > H + 50) { bullets.splice(i, 1); continue; }
    // Hit rocks
    for (let j = rocks.length - 1; j >= 0; j--) {
      const r = rocks[j];
      if (Math.hypot(b.x - r.x, b.y - r.y) < r.size * 0.7) {
        r.hp--;
        burst(b.x, b.y, 4, `hsl(${r.hue},70%,60%)`, 3);
        if (r.hp <= 0) destroyRock(j);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  // Rocks drift & wrap
  for (const r of rocks) {
    r.x += r.vx; r.y += r.vy; r.rot += r.rotSpd;
    if (r.x < -r.size - 20) r.x = W + r.size; if (r.x > W + r.size + 20) r.x = -r.size;
    if (r.y < -r.size - 20) r.y = H + r.size; if (r.y > H + r.size + 20) r.y = -r.size;
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

function destroyRock(idx) {
  const r = rocks[idx];
  score += Math.floor(r.size / 5);
  document.getElementById('score').textContent = score;
  burst(r.x, r.y, Math.min(30, Math.ceil(r.size / 3)), `hsl(${r.hue},80%,55%)`, 5);
  // Break into smaller pieces
  if (r.size > 20) {
    const count = Math.max(2, Math.min(5, Math.floor(r.size / 18)));
    const newSz = r.size / (count === 2 ? 2 : 2.5);
    for (let k = 0; k < count; k++) {
      const a = randRange(0, Math.PI * 2);
      const v = randRange(.5, 2);
      rocks.push(makeRock(r.x + randRange(-10, 10), r.y + randRange(-10, 10), newSz, Math.cos(a) * v + r.vx * .5, Math.sin(a) * v + r.vy * .5));
    }
  }
  rocks.splice(idx, 1);
}

function killShip(hitRock) {
  lives--;
  document.getElementById('lives').textContent = lives;
  burst(ship.x, ship.y, 40, '#ff6', 7);
  burst(ship.x, ship.y, 25, '#f80', 5);
  ship.alive = false;
  deadTimer = 90; // ~1.5s before respawn
  // Destroy the rock that hit us too
  const idx = rocks.indexOf(hitRock);
  if (idx !== -1) destroyRock(idx);
  if (lives <= 0) gameOver = true;
}

function respawnShip() {
  ship.x = W / 2; ship.y = H / 2;
  ship.vx = 0; ship.vy = 0;
  ship.alive = true;
  invincible = 120; // 2s of invincibility
}

function restartGame() {
  score = 0; lives = 2; gameOver = false; invincible = 0;
  document.getElementById('score').textContent = '0';
  document.getElementById('lives').textContent = '2';
  bullets.length = 0; particles.length = 0; rocks.length = 0;
  spawnInitialRocks();
  respawnShip();
  shooting = false;
}

// --- Draw ---
function draw() {
  ctx.fillStyle = '#06070c';
  ctx.fillRect(0, 0, W, H);

  // Stars parallax
  for (const s of stars) {
    let sx = ((s.x - ship.x * .15) % W + W) % W;
    let sy = ((s.y - ship.y * .15) % H + H) % H;
    ctx.globalAlpha = s.b;
    ctx.fillStyle = '#fff';
    ctx.fillRect(sx, sy, s.s, s.s);
  }
  ctx.globalAlpha = 1;

  // Rocks & Planets
  for (const r of rocks) {
    ctx.save();
    ctx.translate(r.x, r.y);
    ctx.rotate(r.rot);
    ctx.beginPath();
    ctx.moveTo(r.verts[0][0], r.verts[0][1]);
    for (let i = 1; i < r.verts.length; i++) ctx.lineTo(r.verts[i][0], r.verts[i][1]);
    ctx.closePath();
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r.size);
    g.addColorStop(0, `hsl(${r.hue},40%,35%)`);
    g.addColorStop(1, `hsl(${r.hue},30%,15%)`);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.strokeStyle = `hsl(${r.hue},50%,50%)`;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    if (r.size > 40) {
      // Planet ring / atmosphere glow
      ctx.shadowColor = `hsla(${r.hue},80%,60%,.4)`;
      ctx.shadowBlur = 18;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
    ctx.restore();
  }

  // Bullets
  ctx.fillStyle = '#ff0';
  for (const b of bullets) {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Particles
  for (const p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;

  // Game Over overlay
  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.font = 'bold 48px monospace';
    ctx.fillStyle = '#f55';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 30);
    ctx.font = '20px monospace';
    ctx.fillStyle = '#aef';
    ctx.fillText(`Final Score: ${score}`, W / 2, H / 2 + 15);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Press R or Click to restart', W / 2, H / 2 + 55);
    return;
  }

  // Ship
  if (!ship.alive) return;
  // Blink during invincibility
  if (invincible > 0 && Math.floor(invincible / 6) % 2 === 0) return;
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
  ctx.beginPath();
  ctx.moveTo(18, 0);
  ctx.lineTo(-12, -10);
  ctx.lineTo(-7, 0);
  ctx.lineTo(-12, 10);
  ctx.closePath();
  ctx.fillStyle = '#cde';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Engine flame when thrusting
  if (keys['KeyW'] || keys['ArrowUp']) {
    const flicker = Math.random() * 8;
    ctx.beginPath();
    ctx.moveTo(-12, -4);
    ctx.lineTo(-18 - flicker, 0);
    ctx.lineTo(-12, 4);
    ctx.closePath();
    ctx.fillStyle = `hsl(${25 + Math.random()*15},100%,${55+Math.random()*20}%)`;
    ctx.fill();
  }
  ctx.restore();
}

// --- Loop ---
function loop() {
  update(16);
  draw();
  requestAnimationFrame(loop);
}
addEventListener('keydown', e => { if (e.code === 'KeyR' && gameOver) restartGame(); });
loop();
</script>
</body>
</html>
