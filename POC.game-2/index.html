<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Breaker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}body{overflow:hidden;background:#000;cursor:crosshair}canvas{display:block}
#hud{position:fixed;top:12px;left:16px;color:#aef;font:bold 18px monospace;text-shadow:0 0 8px #4af;pointer-events:none;z-index:10}
#hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:rgba(170,238,255,.5);font:13px monospace;pointer-events:none;white-space:nowrap}
</style>
</head>
<body>
<div id="hud">SCORE <span id="score">0</span> &nbsp;&nbsp; LIVES <span id="lives">2</span></div>
<div id="hint">W/&uarr; thrust | S/&darr; brake | A/&larr; D/&rarr; rotate | Space / Click — shoot</div>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}resize();addEventListener('resize',resize);
const keys={};let shooting=false;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){shooting=true;e.preventDefault()}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')shooting=false});
addEventListener('mousedown',()=>shooting=true);addEventListener('mouseup',()=>shooting=false);
let score=0,lives=2,gameOver=false,invincible=0,deadTimer=0,lastShot=0;
const bullets=[],rocks=[],particles=[];
const stars=[];for(let i=0;i<250;i++)stars.push({x:Math.random()*5000-1500,y:Math.random()*5000-1500,s:Math.random()*1.6+.3,b:Math.random()*.6+.2});
const ship={x:400,y:300,angle:0,vx:0,vy:0,alive:true};
function rr(a,b){return a+Math.random()*(b-a)}
function makeRock(x,y,size,vx,vy){const verts=[],n=7+(Math.random()*4|0);for(let i=0;i<n;i++){const a=(i/n)*Math.PI*2,r=size*(.7+Math.random()*.5);verts.push([Math.cos(a)*r,Math.sin(a)*r])}let hue,sat;if(size>50){hue=rr(90,160);sat=55}else if(size>25){hue=rr(15,45);sat=60}else{hue=rr(200,260);sat=50}return{x,y,size,vx:vx||rr(-.8,.8),vy:vy||rr(-.8,.8),rot:0,rotSpd:rr(-.015,.015),verts,hue,sat,hp:Math.ceil(size/10)}}
function spawnRocks(){for(let i=0;i<14;i++)rocks.push(makeRock(rr(0,W),rr(0,H),rr(15,95)))}spawnRocks();
function burst(x,y,count,color,spd){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,v=rr(.5,spd||4);particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:rr(.015,.04),color})}}
function killShip(r){lives--;document.getElementById('lives').textContent=lives;burst(ship.x,ship.y,45,'#ff6',7);burst(ship.x,ship.y,30,'#f80',5);burst(ship.x,ship.y,15,'#fff',3);ship.alive=false;deadTimer=90;const idx=rocks.indexOf(r);if(idx!==-1)destroyRock(idx);if(lives<=0)gameOver=true}
function respawnShip(){ship.x=W/2;ship.y=H/2;ship.vx=0;ship.vy=0;ship.angle=0;ship.alive=true;invincible=120}
function restartGame(){score=0;lives=2;gameOver=false;invincible=0;document.getElementById('score').textContent='0';document.getElementById('lives').textContent='2';bullets.length=0;particles.length=0;rocks.length=0;spawnRocks();respawnShip();shooting=false}
function destroyRock(idx){const r=rocks[idx];score+=Math.floor(r.size/4);document.getElementById('score').textContent=score;burst(r.x,r.y,Math.min(35,Math.ceil(r.size/2.5)),`hsl(${r.hue},80%,55%)`,5);if(r.size>20){let count,newSz;if(r.size>50){count=3+(Math.random()*3|0);newSz=r.size/2.8}else{count=2+(Math.random()*2|0);newSz=r.size/2.2}for(let k=0;k<count;k++){const a=rr(0,Math.PI*2),v=rr(.5,2);rocks.push(makeRock(r.x+rr(-12,12),r.y+rr(-12,12),newSz,Math.cos(a)*v+r.vx*.5,Math.sin(a)*v+r.vy*.5))}}rocks.splice(idx,1)}
function update(){if(gameOver){if(keys['KeyR']||shooting)restartGame();return}
if(!ship.alive){deadTimer--;if(deadTimer<=0&&lives>0)respawnShip()}else{
const rotSpeed=.045;if(keys['KeyA']||keys['ArrowLeft'])ship.angle-=rotSpeed;if(keys['KeyD']||keys['ArrowRight'])ship.angle+=rotSpeed;
const thrust=.18,brake=.12,drag=.995,maxSpd=7;
if(keys['KeyW']||keys['ArrowUp']){ship.vx+=Math.cos(ship.angle)*thrust;ship.vy+=Math.sin(ship.angle)*thrust}
if(keys['KeyS']||keys['ArrowDown']){ship.vx-=Math.cos(ship.angle)*brake;ship.vy-=Math.sin(ship.angle)*brake}
ship.vx*=drag;ship.vy*=drag;const spd=Math.hypot(ship.vx,ship.vy);if(spd>maxSpd){ship.vx=ship.vx/spd*maxSpd;ship.vy=ship.vy/spd*maxSpd}
ship.x+=ship.vx;ship.y+=ship.vy;ship.x=((ship.x%W)+W)%W;ship.y=((ship.y%H)+H)%H;
if(invincible>0)invincible--;
if(invincible<=0){for(const r of rocks){if(Math.hypot(ship.x-r.x,ship.y-r.y)<r.size*.65+10){killShip(r);break}}}}
const now=performance.now();
if(shooting&&now-lastShot>130&&ship.alive){lastShot=now;bullets.push({x:ship.x+Math.cos(ship.angle)*18,y:ship.y+Math.sin(ship.angle)*18,vx:Math.cos(ship.angle)*14+ship.vx,vy:Math.sin(ship.angle)*14+ship.vy,life:55})}
for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];b.x+=b.vx;b.y+=b.vy;b.life--;if(b.life<=0||b.x<-50||b.x>W+50||b.y<-50||b.y>H+50){bullets.splice(i,1);continue}for(let j=rocks.length-1;j>=0;j--){const r=rocks[j];if(Math.hypot(b.x-r.x,b.y-r.y)<r.size*.7){r.hp--;burst(b.x,b.y,4,`hsl(${r.hue},70%,60%)`,3);if(r.hp<=0)destroyRock(j);bullets.splice(i,1);break}}}
for(const r of rocks){r.x+=r.vx;r.y+=r.vy;r.rot+=r.rotSpd;if(r.x<-r.size-20)r.x=W+r.size;if(r.x>W+r.size+20)r.x=-r.size;if(r.y<-r.size-20)r.y=H+r.size;if(r.y>H+r.size+20)r.y=-r.size}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=p.decay;if(p.life<=0)particles.splice(i,1)}}
function draw(){ctx.fillStyle='#05060c';ctx.fillRect(0,0,W,H);
for(const s of stars){let sx=((s.x-ship.x*.12)%W+W)%W,sy=((s.y-ship.y*.12)%H+H)%H;ctx.globalAlpha=s.b;ctx.fillStyle='#fff';ctx.fillRect(sx,sy,s.s,s.s)}ctx.globalAlpha=1;
for(const r of rocks){ctx.save();ctx.translate(r.x,r.y);ctx.rotate(r.rot);ctx.beginPath();ctx.moveTo(r.verts[0][0],r.verts[0][1]);for(let i=1;i<r.verts.length;i++)ctx.lineTo(r.verts[i][0],r.verts[i][1]);ctx.closePath();const g=ctx.createRadialGradient(-r.size*.2,-r.size*.2,0,0,0,r.size);g.addColorStop(0,`hsl(${r.hue},${r.sat}%,40%)`);g.addColorStop(1,`hsl(${r.hue},${r.sat}%,14%)`);ctx.fillStyle=g;ctx.fill();ctx.strokeStyle=`hsl(${r.hue},60%,50%)`;ctx.lineWidth=1.5;ctx.stroke();if(r.size>50){ctx.shadowColor=`hsla(${r.hue},80%,60%,.5)`;ctx.shadowBlur=22;ctx.stroke();ctx.shadowBlur=0}ctx.restore()}
for(const b of bullets){ctx.beginPath();ctx.arc(b.x,b.y,2.5,0,Math.PI*2);ctx.fillStyle='#ff0';ctx.fill();ctx.beginPath();ctx.arc(b.x,b.y,1.2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill()}
for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.fillRect(p.x-2,p.y-2,4,4)}ctx.globalAlpha=1;
if(gameOver){ctx.fillStyle='rgba(0,0,0,.65)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.font='bold 52px monospace';ctx.fillStyle='#f55';ctx.fillText('GAME OVER',W/2,H/2-30);ctx.font='22px monospace';ctx.fillStyle='#aef';ctx.fillText(`Final Score: ${score}`,W/2,H/2+20);ctx.font='16px monospace';ctx.fillStyle='#ccc';ctx.fillText('Press R or Click to restart',W/2,H/2+60);return}
if(!ship.alive)return;if(invincible>0&&((invincible/5|0)%2===0))return;
ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle);
if(keys['KeyW']||keys['ArrowUp']){const f=Math.random()*8;ctx.beginPath();ctx.moveTo(-12,-4);ctx.lineTo(-18-f,0);ctx.lineTo(-12,4);ctx.closePath();ctx.fillStyle=`hsl(${25+Math.random()*15},100%,${55+Math.random()*20}%)`;ctx.fill()}
ctx.beginPath();ctx.moveTo(18,0);ctx.lineTo(-12,-10);ctx.lineTo(-7,0);ctx.lineTo(-12,10);ctx.closePath();ctx.fillStyle='#cde';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.2;ctx.stroke();
ctx.beginPath();ctx.arc(6,0,2.5,0,Math.PI*2);ctx.fillStyle='#489';ctx.fill();ctx.restore()}
function loop(){update();draw();requestAnimationFrame(loop)}loop();
</script>
</body>
</html>
